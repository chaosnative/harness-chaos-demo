apiVersion: v1
kind: ConfigMap
metadata:
  name: banking-config
data:
  # Eureka Discovery Service
  EUREKA_SERVER_URL: "http://discovery-service:8080/eureka"
  
  # Config Server
  CONFIG_SERVER_URL: "http://config-server:8888"
  
  # Kafka Configuration
  KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
  KAFKA_ZOOKEEPER_CONNECT: "zookeeper:2181"
  
  # Zipkin Configuration
  ZIPKIN_BASE_URL: "http://zipkin:9411"
  
  # Keycloak Configuration
  KEYCLOAK_URL: "http://keycloak:8080"
  
  # Mail Configuration
  MAIL_HOST: "mail-dev"
  MAIL_PORT: "1025"
  
  # MongoDB Configuration
  MONGODB_HOST: "mongodb"
  MONGODB_PORT: "27017"
  
  # PostgreSQL Configuration
  POSTGRES_HOST: "postgresql"
  POSTGRES_PORT: "5432"

  kafka.bootstrap.servers: "kafka-service:9092"
  kafka.consumer.auto.offset.reset: "earliest"
  
  # Service URLs
  gateway.url: "http://gateway-service:8080"
  validator.url: "http://validator-service:8086"
  transaction.url: "http://transaction-service:10090"
  account.url: "http://account-service:10080"
  auth.url: "http://auth-service:10070"
  notification.url: "http://notification-service:8085"
  
  # Database Configuration
  postgres.host: "postgresql-service"
  postgres.port: "5432"
  
  # Kafka Topics
  kafka.topic.sanity: "sanity"
  kafka.topic.transfer: "transfer"
  kafka.topic.validation-failed: "validation-failed"
  kafka.topic.transaction-events: "transaction-events"
  kafka.topic.account-events: "account-events"
  
  # Logging Configuration
  logging.level.root: "INFO"
  logging.level.com.example: "DEBUG"
  
  # Spring Profiles
  spring.profiles.active: "prod"
