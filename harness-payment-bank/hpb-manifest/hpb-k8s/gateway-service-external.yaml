---
apiVersion: v1
kind: Service
metadata:
  name: gateway-service-external
spec:
  externalTrafficPolicy: Cluster
  internalTrafficPolicy: Cluster
  ipFamilies:
  - IPv4
  ipFamilyPolicy: SingleStack
  ports:
  - port: 80
    protocol: TCP
    targetPort: 8080
  selector:
    app: gateway-service
  sessionAffinity: None
  type: LoadBalancer
