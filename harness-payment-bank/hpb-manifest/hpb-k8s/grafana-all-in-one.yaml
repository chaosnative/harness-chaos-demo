# Self-contained Grafana install for Harness Payments Bank.
# Includes: datasources, dashboard provider, all banking dashboards,
# Deployment, and Service.
#
# Apply (does not modify existing grafana.yaml / kustomization):
#   kubectl apply -f grafana-all-in-one.yaml -n <namespace>
#
# Default login: admin / admin
# Prometheus datasource URL: http://prometheus:80 (UID: prometheus)
---
# Datasource provisioning: point Grafana at the in-namespace Prometheus.
# UID must be "prometheus" because the dashboards reference that datasource UID.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:80
        isDefault: true
        editable: true
---
# Dashboard provider: load all dashboards from the mounted directory.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
data:
  provider.yaml: |
    apiVersion: 1
    providers:
      - name: 'banking-dashboards'
        orgId: 1
        folder: 'Banking'
        type: file
        disableDeletion: false
        editable: true
        allowUiUpdates: true
        updateIntervalSeconds: 30
        options:
          path: /var/lib/grafana/dashboards
          foldersFromFilesStructure: false
---
# All default banking dashboards (sourced from harness-payments-bank/grafana-dashboards).
