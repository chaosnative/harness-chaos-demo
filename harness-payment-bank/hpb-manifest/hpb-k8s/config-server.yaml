---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: config-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: config-server
  template:
    metadata:
      labels:
        app: config-server
    spec:
      containers:
      - name: config-server
        image: aady12/hpb-config-server:0.0.4
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8888
          name: http
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: "prod,native"
        - name: SPRING_CLOUD_CONFIG_SERVER_NATIVE_SEARCHLOCATIONS
          value: "classpath:/configurations"
        - name: SPRING_CLOUD_CONFIG_SERVER_NATIVE_SEARCH_LOCATIONS
          value: "classpath:/configurations"
        - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
          valueFrom:
            configMapKeyRef:
              name: banking-config
              key: EUREKA_SERVER_URL
        - name: SPRING_MAIL_PORT
          value: "587"
        - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
          valueFrom:
            configMapKeyRef:
              name: banking-config
              key: KAFKA_BOOTSTRAP_SERVERS
        - name: SPRING_MAIL_PORT
          value: "587"
        - name: SPRING_MAIL_HOST
          valueFrom:
            secretKeyRef:
              name: sendgrid-secret
              key: SENDGRID_HOST
              optional: true
        - name: SPRING_MAIL_USERNAME
          valueFrom:
            secretKeyRef:
              name: sendgrid-secret
              key: SENDGRID_USERNAME
              optional: true
        - name: SPRING_MAIL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: sendgrid-secret
              key: SENDGRID_API_KEY
              optional: true
        - name: SPRING_MAIL_VERIFIED_EMAIL
          valueFrom:
            secretKeyRef:
              name: sendgrid-secret
              key: SENDGRID_VERIFIED_EMAIL
              optional: true
        - name: SENDGRID_VERIFIED_EMAIL
          valueFrom:
            secretKeyRef:
              name: sendgrid-secret
              key: SENDGRID_VERIFIED_EMAIL
              optional: true
        - name: MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE
          value: "health,info,metrics,prometheus"
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8888
          initialDelaySeconds: 90
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8888
          initialDelaySeconds: 60
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: config-server
spec:
  selector:
    app: config-server
  ports:
  - port: 8888
    targetPort: 8888
    protocol: TCP
  type: ClusterIP
