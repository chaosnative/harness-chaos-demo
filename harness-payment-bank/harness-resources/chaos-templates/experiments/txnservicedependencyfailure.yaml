name: txn-service-dependency-failure
identity: txnservicedependencyfailure
description: Simulates dependency failure for the transaction-service by blocking
  all network traffic to gateway-service for 120s. Validates transaction health, transaction
  integrity across 3 pipeline stages, Kafka message age, and user account API availability.
tags:
- hpb
kind: ChaosExperimentTemplate
apiVersion: litmuschaos.io/v1beta1
spec:
  infraType: KubernetesV2
  faults:
  - name: pod-network-loss-4mc
    identity: pod-network-loss
    revision: v1
    isEnterprise: true
    values:
    - name: TARGET_WORKLOAD_KIND
      value: deployment
    - name: TARGET_WORKLOAD_NAMES
      value: transaction-service
    - name: TOTAL_CHAOS_DURATION
      value: 120
    - name: POD_AFFECTED_PERCENTAGE
      value: 100
    - name: TARGET_WORKLOAD_NAMESPACE
      value: <+experiment.variables.TARGET_NAMESPACE>
    - name: DESTINATION_HOSTS
      value: gateway-service.<+experiment.variables.TARGET_NAMESPACE>
    authEnabled: false
  probes:
  - name: hpb-transation-svc-health-check-0bt-0bt
    identity: hpb-transation-svc-health-check
    isEnterprise: false
    weightage: 10
    duration: 30s
    enableDataCollection: false
    values:
    - name: URL
      value: http://gateway-service.<+experiment.variables.TARGET_NAMESPACE>:8080/api/v1/transactions/account/1?page=0&size=20&sort=createdAt,desc
    - name: AUTH_CREDENTIALS
      value: __BEARER_TOKEN__
  - name: hpb-transaction-validation-ls5-ls5
    identity: hpb-transaction-validation
    isEnterprise: false
    weightage: 10
    duration: 90s
    enableDataCollection: false
    values:
    - name: API_URL_BASE
      value: http://gateway-service.<+experiment.variables.TARGET_NAMESPACE>:8080/api/v1
    - name: ACCOUNT_ID
      value: '1'
    - name: AUTH_TOKEN
      value: __BEARER_TOKEN__
  - name: hpb-transaction-validation-snt-snt
    identity: hpb-transaction-validation
    isEnterprise: false
    weightage: 10
    duration: 90s
    enableDataCollection: false
    values:
    - name: AUTH_TOKEN
      value: __BEARER_TOKEN__
    - name: ACCOUNT_ID
      value: '1'
    - name: API_URL_BASE
      value: http://gateway-service.<+experiment.variables.TARGET_NAMESPACE>:8080/api/v1
  - name: hpb-transaction-validation-1rl-1rl
    identity: hpb-transaction-validation
    isEnterprise: false
    weightage: 10
    duration: 90s
    enableDataCollection: false
    values:
    - name: API_URL_BASE
      value: http://gateway-service.<+experiment.variables.TARGET_NAMESPACE>:8080/api/v1
    - name: ACCOUNT_ID
      value: '1'
    - name: AUTH_TOKEN
      value: __BEARER_TOKEN__
  - name: hpb-transation-svc-health-check-lae-lae
    identity: hpb-transation-svc-health-check
    isEnterprise: false
    weightage: 10
    duration: 30s
    enableDataCollection: false
    values:
    - name: URL
      value: http://gateway-service.<+experiment.variables.TARGET_NAMESPACE>:8080/api/v1/transactions/account/1?page=0&size=20&sort=createdAt,desc
    - name: AUTH_CREDENTIALS
      value: __BEARER_TOKEN__
  - name: banking-user-api-check-zgj-zgj
    identity: banking-user-api-check
    isEnterprise: false
    weightage: 10
    duration: 30s
    enableDataCollection: false
    values:
    - name: URL
      value: http://gateway-service.<+experiment.variables.TARGET_NAMESPACE>:8080/api/v1/accounts/user/4
    - name: AUTH_CREDENTIALS
      value: __BEARER_TOKEN__
  - name: kafka-topic-message-age-check-dxu-dxu
    identity: kafka-topic-message-age-check
    isEnterprise: false
    weightage: 10
    duration: 30s
    enableDataCollection: false
    values:
    - name: PROMETHEUSPROBEINPUTS_CONNECTORID
      value: <+input>
  vertices:
  - name: v-0d9
    start:
      probes:
      - name: hpb-transation-svc-health-check-0bt-0bt
      - name: hpb-transaction-validation-ls5-ls5
    end: {}
  - name: v-4np
    start:
      probes:
      - name: hpb-transaction-validation-snt-snt
      - name: banking-user-api-check-zgj-zgj
      faults:
      - name: pod-network-loss-4mc
    end:
      probes:
      - name: hpb-transation-svc-health-check-0bt-0bt
      - name: hpb-transaction-validation-ls5-ls5
  - name: v-1t8
    start:
      probes:
      - name: hpb-transaction-validation-1rl-1rl
      - name: hpb-transation-svc-health-check-lae-lae
      - name: kafka-topic-message-age-check-dxu-dxu
    end:
      probes:
      - name: hpb-transaction-validation-snt-snt
      - name: banking-user-api-check-zgj-zgj
      faults:
      - name: pod-network-loss-4mc
  - name: v-end
    start: {}
    end:
      probes:
      - name: hpb-transaction-validation-1rl-1rl
      - name: hpb-transation-svc-health-check-lae-lae
      - name: kafka-topic-message-age-check-dxu-dxu
  cleanupPolicy: delete
variables:
- name: TARGET_NAMESPACE
  value: <+input>
  type: String
  required: true
revision: v1
isDefault: true
